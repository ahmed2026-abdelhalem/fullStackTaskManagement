<div class="register-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>User Registration</h2>

  <form (ngSubmit)="onRegister()">
    <div style="margin-bottom: 15px;">
      <label>Name</label>
      <input type="text" [(ngModel)]="userData.name" name="name" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Email</label>
      <input type="email" [(ngModel)]="userData.email" name="email" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password</label>
      <input type="password" [(ngModel)]="userData.password" name="password" required style="width: 100%; padding: 8px;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Register</button>
  </form>

  <p *ngIf="errorMessage" style="color: red; margin-top: 10px;">{{ errorMessage }}</p>

  <div style="margin-top: 15px; text-align: center;">
    <a routerLink="/login" style="color: #007bff; text-decoration: none;">Already have an account? Login</a>
  </div>
</div>
