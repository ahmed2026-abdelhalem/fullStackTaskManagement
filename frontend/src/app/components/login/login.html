<div class="login-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>User Login</h2>

  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 15px;">
      <label>Email</label>
      <input type="email" [(ngModel)]="credentials.email" name="email" required class="form-control" style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password</label>
      <input type="password" [(ngModel)]="credentials.password" name="password" required class="form-control" style="width: 100%; padding: 8px;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
  </form>

  <p *ngIf="errorMessage" style="color: red; margin-top: 10px;">{{ errorMessage }}</p>

  <div style="margin-top: 15px; text-align: center;">
    <a routerLink="/register" style="color: #007bff; text-decoration: none;">Don't have an account? Register</a>
  </div>
</div>
